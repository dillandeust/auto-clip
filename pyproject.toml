[project]
name = "autoclip"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
autoclip = "autoclip.cli:main"

[tool.setuptools.packages.find]
include = ["autoclip*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
